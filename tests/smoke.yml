version: 2.1

# Offline smoke test — proves the orb's commands compose end-to-end without
# hitting the real API. Uses a python HTTP stub for /ci/github-action and the
# baselines endpoint, plants a fake results.json, then asserts prestaflow.env
# has the expected values.

orbs:
  prestaflow: prestaflow/prestaflow@dev:alpha

jobs:
  smoke:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Seed fake results + start mock API
          command: |
            mkdir -p tests/prestaflow
            cat > tests/prestaflow/results.json <<'JSON'
            {"suites":[{"suite":"Smoke","stats":{"passes":2,"failures":0,"skips":0,"todos":0,"time":123},"tests":[{"title":"boots","state":"pass"},{"title":"talks","state":"pass"}]}]}
            JSON
            cat > /tmp/mock.py <<'PY'
            from http.server import BaseHTTPRequestHandler, HTTPServer
            import json
            class H(BaseHTTPRequestHandler):
                def _ok(self, obj):
                    b = json.dumps(obj).encode()
                    self.send_response(200); self.send_header('Content-Type','application/json')
                    self.send_header('Content-Length', str(len(b))); self.end_headers(); self.wfile.write(b)
                def do_POST(self):
                    length = int(self.headers.get('Content-Length','0'))
                    self.rfile.read(length)
                    self._ok({"id":"smoke-123","url":"https://prestaflow.io/r/smoke-123"})
                def do_GET(self):
                    self._ok({"baselines":[],"branch":None,"manifest_sha256":"deadbeef"})
                def log_message(self, *a, **k): pass
            HTTPServer(("127.0.0.1", 8787), H).serve_forever()
            PY
            python3 /tmp/mock.py &
            sleep 1
      - run:
          name: Export test env
          command: echo 'export PRESTAFLOW_TOKEN=test-token' >> "$BASH_ENV"
      - prestaflow/push:
          api_url: "http://127.0.0.1:8787"
          project_id: "pk_smoke"
          execute: false
          flashlight: false
          visual: false
          upload_artifacts: true
          pr_comment: "false"
      - run:
          name: Assert prestaflow.env
          command: |
            cat prestaflow.env
            grep -q "PRESTAFLOW_REPORT_ID=smoke-123" prestaflow.env
            grep -q "PRESTAFLOW_STATUS=success" prestaflow.env
            grep -q "PRESTAFLOW_TOTAL=2" prestaflow.env
            echo "SMOKE OK"

workflows:
  smoke:
    jobs:
      - smoke
