description: |
  Boot a PrestaShop Flashlight container that binds the workspace at the right
  in-container path (auto-detected from composer.json), wait for the back
  office to answer, install the mounted module, and write a merged .env.local
  for the tests: Flashlight's back-office account and demo customer (lowest
  priority), then the repository's .env.local / .env, then the shop's
  PRESTAFLOW_FO_URL / PRESTAFLOW_BO_URL / PRESTAFLOW_PS_VERSION, then the
  PRESTAFLOW_* variables of the job. PRESTAFLOW_PS_VERSION is read from the
  image tag (8.2.8-nginx gives 8.2.8), or from the image for a tag without a
  version (latest). Run `flashlight-restore` at the end of the job to put the
  repository's .env.local back (`push` does it).

  REQUIRES the machine executor (Docker bind mounts from the job workspace are
  not supported inside setup_remote_docker).

parameters:
  ps_version:
    description: "Flashlight image tag (9.0.0, 8.2.8-nginx, latest)"
    type: string
    default: "latest"
  mount:
    type: string
    default: "auto"
  init_scripts:
    type: string
    default: ""
  install_module:
    description: "When composer.json is a prestashop-module, run `php bin/console prestashop:module install <name>` in the container once the shop is ready. A failed install only warns."
    type: boolean
    default: true
steps:
  - run:
      name: "PrestaFlow: flashlight (setup)"
      command: |
        echo 'export PRESTAFLOW_FLASHLIGHT_TAG="<< parameters.ps_version >>"' >> "$BASH_ENV"
        echo 'export PRESTAFLOW_FLASHLIGHT_MOUNT="<< parameters.mount >>"' >> "$BASH_ENV"
        echo 'export PRESTAFLOW_FLASHLIGHT_INIT_SCRIPTS="<< parameters.init_scripts >>"' >> "$BASH_ENV"
        echo 'export PRESTAFLOW_FLASHLIGHT_INSTALL_MODULE="<< parameters.install_module >>"' >> "$BASH_ENV"
  - run:
      name: "PrestaFlow: boot Flashlight"
      command: <<include(scripts/flashlight.sh)>>
