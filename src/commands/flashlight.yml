description: |
  Boot a PrestaShop Flashlight container that binds the workspace at the right
  in-container path (auto-detected from composer.json), wait for HTTP readiness,
  and export PRESTAFLOW_FO_URL for downstream steps.

  REQUIRES the machine executor (Docker bind mounts from the job workspace are
  not supported inside setup_remote_docker).

parameters:
  ps_version:
    type: string
    default: "latest"
  mount:
    type: string
    default: "auto"
  init_scripts:
    type: string
    default: ""
steps:
  - run:
      name: "PrestaFlow: flashlight (setup)"
      command: |
        echo 'export PRESTAFLOW_PS_VERSION="<< parameters.ps_version >>"' >> "$BASH_ENV"
        echo 'export PRESTAFLOW_FLASHLIGHT_MOUNT="<< parameters.mount >>"' >> "$BASH_ENV"
        echo 'export PRESTAFLOW_FLASHLIGHT_INIT_SCRIPTS="<< parameters.init_scripts >>"' >> "$BASH_ENV"
  - run:
      name: "PrestaFlow: boot Flashlight"
      command: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "flashlight: docker CLI not available — use the prestaflow/machine executor"
          exit 1
        fi

        PS_VERSION="${PRESTAFLOW_PS_VERSION:-latest}"
        MODE="${PRESTAFLOW_FLASHLIGHT_MOUNT:-auto}"
        INIT_SCRIPTS="${PRESTAFLOW_FLASHLIGHT_INIT_SCRIPTS:-}"
        WORKSPACE="$PWD"
        WORKSPACE_BASENAME=$(basename "$WORKSPACE")

        COMPOSER_NAME=""
        COMPOSER_TYPE=""
        if [ -f "$WORKSPACE/composer.json" ] && command -v jq >/dev/null 2>&1; then
          COMPOSER_NAME=$(jq -r '.name // ""' "$WORKSPACE/composer.json" 2>/dev/null || echo "")
          COMPOSER_TYPE=$(jq -r '.type // ""' "$WORKSPACE/composer.json" 2>/dev/null || echo "")
        fi

        NAME="$WORKSPACE_BASENAME"
        if [ -n "$COMPOSER_NAME" ]; then
          case "$COMPOSER_NAME" in
            */*) NAME="${COMPOSER_NAME##*/}" ;;
            *)   NAME="$COMPOSER_NAME" ;;
          esac
        fi

        case "$MODE" in
          root)    CONTAINER_PATH="/var/www/html" ;;
          modules) CONTAINER_PATH="/var/www/html/modules/${NAME}" ;;
          themes)  CONTAINER_PATH="/var/www/html/themes/${NAME}" ;;
          auto)
            case "$COMPOSER_TYPE" in
              prestashop-module) CONTAINER_PATH="/var/www/html/modules/${NAME}" ;;
              prestashop-theme)  CONTAINER_PATH="/var/www/html/themes/${NAME}" ;;
              *)
                CONTAINER_PATH="/var/www/html/modules/${WORKSPACE_BASENAME}"
                echo "flashlight: composer.json missing or type unknown — defaulting to $CONTAINER_PATH"
                ;;
            esac
            ;;
          *) echo "flashlight: invalid mount mode '$MODE'"; exit 1 ;;
        esac

        echo "flashlight: mounting $WORKSPACE at $CONTAINER_PATH (mode=$MODE, PS $PS_VERSION)"

        INIT_SCRIPTS_HOST=""
        if [ -n "$INIT_SCRIPTS" ]; then
          case "$INIT_SCRIPTS" in
            /*) INIT_SCRIPTS_HOST="$INIT_SCRIPTS" ;;
            *)  INIT_SCRIPTS_HOST="$WORKSPACE/$INIT_SCRIPTS" ;;
          esac
          if [ ! -d "$INIT_SCRIPTS_HOST" ]; then
            echo "flashlight: init_scripts path does not exist: $INIT_SCRIPTS_HOST"; exit 1
          fi
        fi

        PORT=""
        for p in 8000 8001 8002; do
          if ! (echo >"/dev/tcp/127.0.0.1/$p") 2>/dev/null; then PORT="$p"; break; fi
        done
        [ -z "$PORT" ] && { echo "flashlight: no free port among 8000..8002"; exit 1; }

        COMPOSE_DIR="$WORKSPACE/.prestaflow-flashlight"
        mkdir -p "$COMPOSE_DIR"
        COMPOSE_FILE="$COMPOSE_DIR/compose.yml"

        EXTRA_VOLUME=""
        if [ -n "$INIT_SCRIPTS_HOST" ]; then
          EXTRA_VOLUME="      - ${INIT_SCRIPTS_HOST}:/tmp/init-scripts:ro"
        fi

        {
          printf '%s\n' "services:"
          printf '%s\n' "  prestashop:"
          printf '%s\n' "    image: prestashop/prestashop-flashlight:${PS_VERSION}"
          printf '%s\n' "    depends_on:"
          printf '%s\n' "      mysql:"
          printf '%s\n' "        condition: service_healthy"
          printf '%s\n' "    ports:"
          printf '%s\n' "      - \"${PORT}:80\""
          printf '%s\n' "    volumes:"
          printf '%s\n' "      - ${WORKSPACE}:${CONTAINER_PATH}"
          [ -n "$EXTRA_VOLUME" ] && printf '%s\n' "$EXTRA_VOLUME"
          printf '%s\n' "    environment:"
          printf '%s\n' "      PS_DOMAIN: localhost:${PORT}"
          printf '%s\n' "      DEBUG_MODE: 0"
          printf '%s\n' "      INIT_ON_RESTART: 0"
          printf '%s\n' "  mysql:"
          printf '%s\n' "    image: mariadb:lts"
          printf '%s\n' "    healthcheck:"
          printf '%s\n' "      test: [\"CMD\", \"healthcheck.sh\", \"--connect\"]"
          printf '%s\n' "      interval: 10s"
          printf '%s\n' "      timeout: 10s"
          printf '%s\n' "      retries: 5"
          printf '%s\n' "    environment:"
          printf '%s\n' "      MYSQL_USER: prestashop"
          printf '%s\n' "      MYSQL_PASSWORD: prestashop"
          printf '%s\n' "      MYSQL_ROOT_PASSWORD: prestashop"
          printf '%s\n' "      MYSQL_DATABASE: prestashop"
        } > "$COMPOSE_FILE"

        docker compose -f "$COMPOSE_FILE" up -d

        URL="http://localhost:${PORT}"
        DEADLINE=$(( $(date +%s) + 240 ))
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "$URL" || echo "000")
          if [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 400 ] 2>/dev/null; then
            echo "flashlight: ready at $URL (HTTP $CODE)"; break
          fi
          sleep 2
        done
        if [ "$(date +%s)" -ge "$DEADLINE" ]; then
          echo "flashlight: not ready after 240s — dumping logs"
          docker compose -f "$COMPOSE_FILE" logs || true
          exit 1
        fi

        echo "export PRESTAFLOW_FO_URL=${URL}/" >> "$BASH_ENV"
        {
          echo "PRESTAFLOW_FO_URL=${URL}/"
          echo "PRESTAFLOW_PS_VERSION=${PS_VERSION}"
        } >> "$WORKSPACE/.env.local"
        {
          echo "PRESTAFLOW_FO_URL=${URL}/"
          echo "PRESTAFLOW_PS_VERSION=${PS_VERSION}"
        } >> "$WORKSPACE/prestaflow.env"

        echo "flashlight: ready — PRESTAFLOW_FO_URL=${URL}/"
