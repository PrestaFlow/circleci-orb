description: |
  Parse results.json to compute passed/failed/skipped/total/duration + status,
  export them via BASH_ENV and append to prestaflow.env. Exits non-zero when
  any test failed — matches the GitHub Action's `status: 'failure'` semantics.

steps:
  - run:
      name: "PrestaFlow: set outputs"
      command: |
        set -euo pipefail
        RESULTS=""
        for c in tests/prestaflow/results.json prestaflow/results.json; do
          if [ -f "$c" ]; then RESULTS="$c"; break; fi
        done
        if [ -n "$RESULTS" ]; then
          STATS=$(jq '
            def tonum(x): (x // 0 | tonumber? // 0);
            def acc(s): s as $s |
              { passed: ($s.stats.passes | tonum(.)),
                failed: ($s.stats.failures | tonum(.)),
                skipped: (($s.stats.skips | tonum(.)) + ($s.stats.skippeds | tonum(.))),
                todos: ($s.stats.todos | tonum(.)),
                durationMs: ($s.stats.time | tonum(.)) };
            (if (.suites | type == "array") then [ .suites[] | acc(.) ]
             elif .stats then [ acc(.) ]
             else [] end)
            | { passed: ([.[].passed] | add // 0),
                failed: ([.[].failed] | add // 0),
                skipped: ([.[].skipped] | add // 0),
                todos: ([.[].todos] | add // 0),
                durationMs: ([.[].durationMs] | add // 0) }
            | .total = (.passed + .failed + .skipped + .todos)
          ' "$RESULTS")
        else
          STATS='{"passed":0,"failed":0,"skipped":0,"total":0,"durationMs":0}'
          echo "set-outputs: no results.json — writing zero counters"
        fi

        PASSED=$(echo "$STATS" | jq -r '.passed')
        FAILED=$(echo "$STATS" | jq -r '.failed')
        SKIPPED=$(echo "$STATS" | jq -r '.skipped')
        TOTAL=$(echo "$STATS" | jq -r '.total')
        DURATION_MS=$(echo "$STATS" | jq -r '.durationMs')
        STATUS="success"; [ "$FAILED" != "0" ] && STATUS="failure"

        {
          echo "export PRESTAFLOW_PASSED=${PASSED}"
          echo "export PRESTAFLOW_FAILED=${FAILED}"
          echo "export PRESTAFLOW_SKIPPED=${SKIPPED}"
          echo "export PRESTAFLOW_TOTAL=${TOTAL}"
          echo "export PRESTAFLOW_DURATION_MS=${DURATION_MS}"
          echo "export PRESTAFLOW_STATUS=${STATUS}"
        } >> "$BASH_ENV"

        {
          echo "PRESTAFLOW_PASSED=${PASSED}"
          echo "PRESTAFLOW_FAILED=${FAILED}"
          echo "PRESTAFLOW_SKIPPED=${SKIPPED}"
          echo "PRESTAFLOW_TOTAL=${TOTAL}"
          echo "PRESTAFLOW_DURATION_MS=${DURATION_MS}"
          echo "PRESTAFLOW_STATUS=${STATUS}"
        } >> prestaflow.env

        echo "set-outputs: total=${TOTAL} passed=${PASSED} failed=${FAILED} skipped=${SKIPPED} status=${STATUS}"
        if [ "$FAILED" != "0" ]; then
          echo "set-outputs: ${FAILED} test(s) failed — exiting non-zero"
          exit 1
        fi
