description: |
  Run `composer run prestaflow:json:file`. Skipped when no composer.json is
  present. A non-zero exit is surfaced but does NOT abort the job — failures
  are reported through the API + PR comment. After the flashlight command, the
  PRESTAFLOW_* variables it wrote to .env.local are removed from composer's
  environment so that the library reads them from the file.

parameters:
  suites:
    type: string
    default: ""
steps:
  - run:
      name: "PrestaFlow: run-tests (setup)"
      command: |
        echo 'export PRESTAFLOW_SUITES="<< parameters.suites >>"' >> "$BASH_ENV"
  - run:
      name: "PrestaFlow: run tests"
      command: <<include(scripts/run-tests.sh)>>
