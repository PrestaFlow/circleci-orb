description: |
  Run `composer run prestaflow:json:file`. Skipped when no composer.json is
  present. A non-zero exit is surfaced but does NOT abort the job — failures
  are reported through the API + PR comment.

parameters:
  suites:
    type: string
    default: ""
steps:
  - run:
      name: "PrestaFlow: run-tests (setup)"
      command: |
        echo 'export PRESTAFLOW_SUITES="<< parameters.suites >>"' >> "$BASH_ENV"
  - run:
      name: "PrestaFlow: run tests"
      command: |
        set -euo pipefail
        if [ ! -f composer.json ]; then
          echo "run-tests: no composer.json — skipping"; exit 0
        fi
        if ! command -v composer >/dev/null 2>&1; then
          echo "run-tests: composer not installed — use install-deps with install_composer=true or a composer-capable executor"
          exit 1
        fi
        echo "run-tests: composer run prestaflow:json:file (suites=${PRESTAFLOW_SUITES:-<all>})"
        set +e
        composer run prestaflow:json:file
        RC=$?
        set -e
        if [ $RC -ne 0 ]; then
          echo "run-tests: composer exited $RC — parsing/uploading results anyway"
        fi
